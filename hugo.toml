baseURL = 'https://www.martasbgcorner.com/'
DefaultContentLanguage = 'en'
DefaultContentLanguageInSubdir = true
theme = 'Stack'

[markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category  = "categories"
  tag       = "tags"
  designer  = "designers"
  publisher = "publishers"
  game = "games"

[params]
    favicon = "logos/logo_martasbgcorner.png"

[params.sidebar]
    emoji = ""
    avatar = "logos/logo_martasbgcorner.png"

[languages]
  [languages.en]
    contentDir = 'content/en'
    languageCode = 'en-us'
    languageDirection = 'ltr'
    languageName = 'English'
    title = "Marta's BG Corner"
    weight = 1
    
    [languages.en.params]
        mainSections = ["posts"]
        description = "My little corner of the internet for board game reviews, solo plays, monthly recaps, and everything that fuels this hobby."

        [[languages.en.menu.main]]
            name = "About"
            url = "/en/page/about"
            weight = 1
        [[languages.en.menu.main]]
            name = "Posts"
            url = "/en/posts"
            weight = 2
        [[languages.en.menu.main]]
            name = "Categories"
            url = "/en/categories"
            weight = 3
        [[languages.en.menu.main]]
            name = "Games"
            url = "/en/games"
            weight = 4
        [[languages.en.menu.main]]
            name = "Designers"
            url = "/en/designers"
            weight = 5
        [[languages.en.menu.main]]
            name = "Publishers"
            url = "/en/publishers"
            weight = 6
        [[languages.en.menu.main]]
            name = "Tags"
            url = "/en/tags"
            weight = 7
        [[languages.en.menu.main]]
            identifier = "library"
            name = "Library"
            url = "/en/library"
            weight = 8
        [[languages.en.menu.main]]
            identifier = "subscribe"
            name = "Subscribe"
            url = "/en/subscribe"
            weight = 99
    
    [languages.en.params.sidebar]
        emoji = ""
        subtitle = ""
  
  [languages.fr]
    contentDir = 'content/fr'
    languageCode = 'fr-FR'
    languageDirection = 'ltr'
    languageName = 'Français'
    title = "Marta's BG Corner"
    weight = 2
    
    [languages.fr.params]
        mainSections = ["posts"]
        description = "Mon petit coin d'internet pour des critiques de jeux de société, mes parties en solo et mes récapitulatifs mensuels, ainsi que tout ce qui nourrit cette passion."
        
        [[languages.fr.menu.main]]
            name = "À Propos"
            url = "/fr/page/about"
            weight = 1
        [[languages.fr.menu.main]]
            name = "Posts"
            url = "/fr/posts"
            weight = 2
        [[languages.fr.menu.main]]
            name = "Catégories"
            url = "/fr/categories"
            weight = 3
        [[languages.fr.menu.main]]
            name = "Jeux"
            url = "/fr/games"
            weight = 4
        [[languages.fr.menu.main]]
            name = "Designers"
            url = "/fr/designers"
            weight = 5
        [[languages.fr.menu.main]]
            name = "Éditeurs"
            url = "/fr/publishers"
            weight = 6
        [[languages.fr.menu.main]]
            name = "Tags"
            url = "/fr/tags"
            weight = 7
        [[languages.fr.menu.main]]
            identifier = "library"
            name = "Ludothèque"
            url = "/fr/library"
            weight = 8
        [[languages.fr.menu.main]]
            identifier = "subscribe"
            name = "S'abonner"
            url = "/fr/subscribe"
